spring.application.name=webapp
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=kinastudio;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${KINA_MAIL_USER: }
spring.mail.password=${KINA_MAIL_PASSWORD: }
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
kina.mail.remitente=${KINA_MAIL_REMITENTE: }
kina.front.url=${KINA_FRONT_URL:http://localhost:5173}